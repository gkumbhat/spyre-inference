# Parallel arm with on-arrival image dispatch and the default thread split: the TP
# workers keep their usual threads and the CPU encoder takes the host's spare CPUs.
# Encoder metrics are logged periodically (PARALLEL_ENCODER_PROFILE).
defaults:
  server_health_timeout: 3600
  environment_variables:
    VLLM_CPU_KVCACHE_SPACE: 64
    DTLOG_LEVEL: error
  server_parameters:
    load-format: auto
    tensor-parallel-size: 4
    max-model-len: 32768
  parameters:
    dataset-name: random-mm
    backend: openai-chat
    endpoint: /v1/chat/completions
    ignore-eos: true
    percentile-metrics: ttft,tpot,itl,e2el
    metric-percentiles: 99,100
    max-concurrency: 4
    num-prompts: 200
    input-len: 8192
    output-len: 128
    random-mm-limit-mm-per-prompt: '{"image": 1, "video": 0}'
    random-mm-bucket-config: '{(2048, 2048, 1): 1}'
tests:
- test_name: serve_ministral3-14b_tp4_mm_random_parallel_encoder_prefetch
  server_parameters:
    model: mistralai/Ministral-3-14B-Instruct-2512-BF16
    distributed-executor-backend: spyre_inference.v1.executor.parallel_encoder.executor.ParallelEncoderExecutor
    additional-config: '{"parallel_encoder": {"enabled": true}}'
  environment_variables:
    PARALLEL_ENCODER_PROFILE: 1
    PARALLEL_ENCODER_PROFILE_INTERVAL: 30
